<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0d"><title>LuchaMania | Official Archives</title>
<style>
:root{color-scheme:dark;--bg:#09090d;--surface:#15151c;--surface2:#1c1c25;--line:#30303b;--text:#f6f3f2;--muted:#aba9b3;--accent:#f04343;--gold:#e6c078}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{max-width:1320px;margin:auto;padding:0 24px}.top{position:sticky;top:0;z-index:10;background:#0c0c11ee;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.topinner{display:flex;align-items:center;gap:25px;min-height:75px}.brand{font-weight:1000;letter-spacing:-1.5px;font-size:25px;white-space:nowrap}.brand span{color:var(--accent)}.nav{display:flex;gap:3px;overflow:auto;scrollbar-width:none;flex:1}.nav button{border:0;background:none;color:var(--muted);padding:10px 12px;border-radius:7px;white-space:nowrap;font-weight:700}.nav button.active,.nav button:hover{background:#27202a;color:#fff}.hero{border-bottom:1px solid #362024;background:radial-gradient(circle at 80% 5%,#771b2680,transparent 40%),linear-gradient(125deg,#1b0b13,#111117 70%);padding:64px 0 60px}.eyebrow{color:var(--accent);font-weight:900;letter-spacing:2px;font-size:12px;text-transform:uppercase}.hero h1{font-size:clamp(42px,6.5vw,85px);letter-spacing:-4px;line-height:1.02;margin:14px 0 18px;max-width:870px}.hero p{font-size:18px;color:#c7bfc7;max-width:610px}.btn{border:1px solid var(--line);background:var(--surface2);color:#fff;padding:10px 15px;border-radius:8px;font-weight:800}.btn:hover{border-color:#8b5258}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.small{font-size:12px;padding:6px 10px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:-28px;position:relative}.stat{border:1px solid var(--line);border-radius:12px;background:#16151d;padding:20px}.stat strong{font-size:35px;display:block;line-height:1.2}.stat span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px;font-weight:800}.page{padding:34px 0 90px;min-height:70vh}.sectionHead{display:flex;align-items:end;justify-content:space-between;gap:15px;margin:16px 0 18px}.sectionHead h2{font-size:30px;letter-spacing:-1px;margin:0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:22px;border-radius:12px;background:var(--surface);border:1px solid var(--line);min-width:0}.card h3{margin:8px 0 9px;font-size:21px;line-height:1.2}.card p{margin:8px 0;color:var(--muted)}.card .meta,.meta{font-size:12px;color:var(--gold);font-weight:800;letter-spacing:.4px;text-transform:uppercase}.pill{display:inline-block;font-size:11px;padding:3px 8px;border-radius:4px;background:#39242b;color:#ffb8b8;font-weight:800}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}.field{padding:11px 12px;background:#191820;border:1px solid #3c3943;color:#fff;border-radius:8px;min-width:0}.toolbar .field{min-width:min(300px,100%);flex:1}.empty{padding:35px;border:1px dashed #45414d;border-radius:12px;color:var(--muted);text-align:center}.tablewrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}table{border-collapse:collapse;width:100%;min-width:680px}th,td{padding:14px;text-align:left;border-bottom:1px solid var(--line)}th{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);background:#1b1a22}tr:last-child td{border:0}tr:hover td{background:#1b1920}.detail{background:#17151e;border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:16px}.detail h2{font-size:32px;margin:0}.detail p{white-space:pre-line}.kpi{color:var(--gold);font-weight:900;font-size:26px}.back{margin-bottom:18px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.adminNotice{background:#2b2417;border:1px solid #79613b;border-radius:10px;padding:15px;margin:0 0 22px;color:#f0d5a9}.editor{display:grid;grid-template-columns:1fr 1fr;gap:12px}.editor label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:12px;font-weight:800}.editor .full{grid-column:1/-1}.editor textarea{min-height:90px;resize:vertical}.editor .field{width:100%}.adminTabs{display:flex;gap:6px;flex-wrap:wrap;margin:15px 0}.adminTabs button.active{border-color:var(--accent);background:#422029}.recordRow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.recordRow:last-child{border:0}.tag{border:1px solid #4b3541;border-radius:5px;padding:2px 7px;font-size:11px;color:#e9bdc3}.footer{border-top:1px solid var(--line);color:var(--muted);padding:25px 0;font-size:12px}.hidden{display:none!important}@media(max-width:800px){.topinner{flex-wrap:wrap;gap:0;padding:10px 0}.brand{width:100%}.nav{width:100%}.hero{padding:42px 0 57px}.hero h1{letter-spacing:-2px}.stats{grid-template-columns:repeat(2,1fr)}.grid,.two{grid-template-columns:1fr}.editor{grid-template-columns:1fr}.editor .full{grid-column:1}.shell{padding:0 16px}.page{padding-top:20px}}@media(max-width:430px){.stat strong{font-size:27px}.stat{padding:14px}.hero h1{font-size:42px}}
</style>
</head>
<body>
<header class="top"><div class="shell topinner"><div class="brand">LUCHA<span>MANIA</span><span style="color:#fff;font-size:11px;letter-spacing:2px;display:block;margin-top:-8px">THE OFFICIAL ARCHIVES</span></div><nav class="nav" id="nav"></nav></div></header>
<div id="app"></div><footer class="footer"><div class="shell">© LuchaMania · The Official Archives · Community-run history database. Data stays in this browser until you export it.</div></footer>
<script>
'use strict';
const K='luchamania-database-v1';
const defaults={
 wrestlers:[{id:'w-looch',name:'Looch',debut:'',faction:'',bio:'Member of Dos Locos with ProGraps. The team captured the World Tag Team Championship on August 3, 2026.',status:'Active'},{id:'w-pg',name:'ProGraps',debut:'',faction:'',bio:'Co-founder of Dos Locos alongside Looch. The partnership later fractured.',status:'Active'},{id:'w-croog',name:'Croog',debut:'',faction:'World’s Greatest Swag Team',bio:'One half of WGST alongside Swagner.',status:'Active'},{id:'w-swagner',name:'Swagner',debut:'',faction:'World’s Greatest Swag Team',bio:'One half of WGST alongside Croog.',status:'Active'},{id:'w-pete',name:'Pete',debut:'',faction:'The Dojo',bio:'Dojo leader and mentor.',status:'Active'},{id:'w-jack',name:'Jack',debut:'',faction:'The Dojo',bio:'A leader in the Dojo.',status:'Active'},{id:'w-bhawk',name:'Blackhawk',debut:'',faction:'The Dojo',bio:'Member of the Dojo.',status:'Active'},{id:'w-midcard',name:'Midcard',debut:'',faction:'The Dojo',bio:'Member of the Dojo.',status:'Active'},{id:'w-mac',name:'Mac',debut:'',faction:'',bio:'LuchaMania competitor.',status:'Active'}],
 championships:[{id:'c-tag',name:'World Tag Team Championship',type:'Tag Team',description:'The premier tag team championship of LuchaMania.'},{id:'c-world',name:'LuchaMania World Championship',type:'Singles',description:'The premier singles championship.'},{id:'c-heritage',name:'LuchaMania Heritage Championship',type:'Singles',description:'LuchaMania Heritage title.'}],
 reigns:[{id:'r-dos',championshipId:'c-tag',holder:'Dos Locos (Looch & ProGraps)',start:'2026-08-03',end:'2026-10-19',defenses:2,notes:'Defeated The WarHawks to win. Lost to WGST.'},{id:'r-wgst',championshipId:'c-tag',holder:'World’s Greatest Swag Team (Croog & Swagner)',start:'2026-10-19',end:'',defenses:0,notes:'Won the titles from Dos Locos. Defense total not yet entered.'}],
 events:[{id:'e-aug3',name:'LuchaMania PrimeTime',date:'2026-08-03',type:'PrimeTime',description:'Dos Locos won the World Tag Team Championship.'},{id:'e-aug20',name:'LuchaMania Chaos',date:'2026-08-20',type:'Chaos',description:'Dos Locos retained the World Tag Team Championship.'},{id:'e-sep14',name:'LuchaMania PrimeTime',date:'2026-09-14',type:'PrimeTime',description:'Dos Locos retained against Glorious Hawks.'},{id:'e-oct19',name:'LuchaMania PrimeTime',date:'2026-10-19',type:'PrimeTime',description:'WGST defeated Dos Locos to become World Tag Team Champions.'}],
 matches:[{id:'m-aug3',eventId:'e-aug3',name:'Dos Locos vs The WarHawks',winner:'Dos Locos',score:'',stipulation:'World Tag Team Championship',notes:'Dos Locos win the championships.'},{id:'m-aug20',eventId:'e-aug20',name:'Dos Locos vs seX-Men',winner:'Dos Locos',score:'',stipulation:'World Tag Team Championship',notes:'First successful title defense.'},{id:'m-sep14',eventId:'e-sep14',name:'Dos Locos vs Glorious Hawks',winner:'Dos Locos',score:'285–60 (final); 235–0 (last round)',stipulation:'World Tag Team Championship',notes:'Second successful title defense.'},{id:'m-oct19',eventId:'e-oct19',name:'Dos Locos vs World’s Greatest Swag Team',winner:'World’s Greatest Swag Team',score:'45–34',stipulation:'World Tag Team Championship',notes:'Looch joined late; ProGraps initially competed alone. WGST wins the titles.'}],
 news:[{id:'n-wgst',title:'WGST Capture the World Tag Team Championship',date:'2026-10-19',category:'Championships',body:'Croog and Swagner defeated Dos Locos on LuchaMania PrimeTime to become World Tag Team Champions. The recorded final score was 45–34.'}],
 storylines:[{id:'s-dos',title:'The Fall of Dos Locos',status:'Ongoing',participants:'Looch, ProGraps',summary:'The former World Tag Team Champions have experienced a breakdown in their partnership.'},{id:'s-dojo',title:'The Dojo',status:'Ongoing',participants:'Pete, Jack, Blackhawk, Midcard',summary:'Pete and Jack lead a faction focused on mentoring and developing competitors.'}],
 rankings:[]
};
const collections={wrestlers:[['name','Name','text'],['debut','Debut date','date'],['faction','Faction','text'],['status','Status','text'],['bio','Biography','textarea']],championships:[['name','Championship name','text'],['type','Type','text'],['description','Description','textarea']],reigns:[['championshipId','Championship','championship'],['holder','Champion / team','text'],['start','Date won','date'],['end','Date lost (leave empty if current)','date'],['defenses','Successful defenses','number'],['notes','Notes','textarea']],events:[['name','Event name','text'],['date','Date','date'],['type','Show type','text'],['description','Description','textarea']],matches:[['eventId','Event','event'],['name','Match / participants','text'],['winner','Winner','text'],['score','Final score','text'],['stipulation','Stipulation / title','text'],['notes','Notes','textarea']],news:[['title','Headline','text'],['date','Date','date'],['category','Category','text'],['body','Article','textarea']],storylines:[['title','Storyline title','text'],['status','Status','text'],['participants','Participants','text'],['summary','Summary','textarea']],rankings:[['name','Competitor','text'],['division','Division','text'],['rank','Rank','number'],['notes','Notes','text']]};
const labels={wrestlers:'Roster',championships:'Championships',reigns:'Title Reigns',events:'Events',matches:'Matches',news:'News',storylines:'Storylines',rankings:'Rankings'};
let data=load(),page='home',filter='',selected=null,adminType='wrestlers',editing=null;
function load(){try{let raw=localStorage.getItem(K);if(raw){let d=JSON.parse(raw);if(d&&Object.keys(collections).every(k=>Array.isArray(d[k])))return d}}catch(e){}return structuredClone(defaults)}
function save(){try{localStorage.setItem(K,JSON.stringify(data))}catch(e){alert('Browser storage is full or unavailable. Export a backup before continuing.')}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dt(s){if(!s)return 'Date unknown';const [y,m,d]=s.split('-');return new Date(Number(y),Number(m)-1,Number(d)).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
function days(a,b){if(!a)return '—';const end=b||new Date().toISOString().slice(0,10);return Math.max(0,Math.round((Date.parse(end+'T12:00:00Z')-Date.parse(a+'T12:00:00Z'))/86400000))}
function item(k,id){return data[k].find(x=>x.id===id)}
function title(o){return o.name||o.title||o.holder||'Unnamed record'}
function navTo(p,id=null){page=p;selected=id;filter='';render();window.scrollTo({top:0,behavior:'smooth'})}
function nav(){const n=[['home','Home'],['wrestlers','Roster'],['championships','Titles'],['events','Events'],['news','News'],['storylines','Storylines'],['rankings','Rankings'],['admin','Admin']];document.getElementById('nav').innerHTML=n.map(([p,l])=>`<button class="${page===p?'active':''}" onclick="navTo('${p}')">${l}</button>`).join('')}
function stats(){return `<div class="stats"><div class="stat"><strong>${data.wrestlers.length}</strong><span>Wrestlers indexed</span></div><div class="stat"><strong>${data.events.length}</strong><span>Events archived</span></div><div class="stat"><strong>${data.matches.length}</strong><span>Matches recorded</span></div><div class="stat"><strong>${data.reigns.length}</strong><span>Title reigns documented</span></div></div>`}
function card(label,header,desc,click,extra=''){return `<article class="card"><div class="meta">${esc(label)}</div><h3>${esc(header)}</h3><p>${esc(desc||'')}</p>${extra}<button class="btn small" style="margin-top:12px" onclick="${click}">View details →</button></article>`}
function home(){return `<div class="hero"><div class="shell"><div class="eyebrow">The history. The competitors. The legacy.</div><h1>EVERY MATCH.<br>EVERY MOMENT.<br><span style="color:var(--accent)">FOREVER.</span></h1><p>Your home for LuchaMania history, championship lineages, competitors, events, and the rivalries that shaped it.</p><div class="actions"><button class="btn primary" onclick="navTo('events')">Explore the archives →</button><button class="btn" onclick="navTo('championships')">Championship history</button></div></div></div><div class="shell">${stats()}<div class="sectionHead"><h2>Latest headlines</h2><button class="btn small" onclick="navTo('news')">All news</button></div><div class="grid">${[...data.news].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3).map(x=>card(dt(x.date),x.title,x.body,`navTo('news','${esc(x.id)}')`)).join('')||'<div class="empty">No news entered yet.</div>'}</div><div class="sectionHead"><h2>Recent events</h2><button class="btn small" onclick="navTo('events')">All events</button></div><div class="grid">${[...data.events].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3).map(x=>card(dt(x.date),x.name,x.description,`navTo('events','${esc(x.id)}')`)).join('')||'<div class="empty">No events entered yet.</div>'}</div><div class="sectionHead"><h2>Featured storylines</h2></div><div class="grid">${data.storylines.slice(0,3).map(x=>card(x.status,x.title,x.summary,`navTo('storylines','${esc(x.id)}')`)).join('')}</div></div>`}
function detailPage(){const x=item(page,selected);if(!x){selected=null;return listing()}let extra='';if(page==='wrestlers'){let related=data.matches.filter(m=>(m.name+' '+m.notes).toLowerCase().includes(x.name.toLowerCase()));extra=`<h3>Matches mentioning ${esc(x.name)}</h3>${related.length?related.map(m=>`<div class="recordRow"><span>${esc(m.name)} · ${esc(m.score||'Score not entered')}</span><button class="btn small" onclick="navTo('events','${esc(m.eventId)}')">Event →</button></div>`).join(''):'<p class="muted">No linked match appearances found in entered match text yet.</p>'}`}if(page==='championships'){let r=data.reigns.filter(r=>r.championshipId===x.id).sort((a,b)=>b.start.localeCompare(a.start));extra=`<h3>Title lineage</h3><div class="tablewrap"><table><thead><tr><th>Champion</th><th>From</th><th>To</th><th>Days</th><th>Defenses</th></tr></thead><tbody>${r.map(z=>`<tr><td>${esc(z.holder)}</td><td>${dt(z.start)}</td><td>${z.end?dt(z.end):'<span class="pill">CURRENT</span>'}</td><td>${days(z.start,z.end)}</td><td>${esc(z.defenses??'—')}</td></tr>`).join('')}</tbody></table></div>${r.map(z=>`<p class="muted">${esc(z.holder)}: ${esc(z.notes)}</p>`).join('')}`}if(page==='events'){let m=data.matches.filter(m=>m.eventId===x.id);extra=`<h3>Match card & results</h3>${m.length?m.map(z=>`<div class="card" style="margin:10px 0"><div class="meta">${esc(z.stipulation)}</div><h3>${esc(z.name)}</h3><p><b>Winner:</b> ${esc(z.winner)}${z.score?' · <b>Score:</b> '+esc(z.score):''}</p><p>${esc(z.notes)}</p></div>`).join(''):'<p class="muted">No matches entered for this event yet.</p>'}`}return `<div class="shell page"><button class="btn small back" onclick="navTo('${page}')">← Back to ${esc(labels[page])}</button><div class="detail"><div class="meta">${esc(x.date?dt(x.date):(x.type||x.status||'Archive record'))}</div><h2>${esc(title(x))}</h2>${x.faction?`<p><span class="tag">${esc(x.faction)}</span></p>`:''}${x.participants?`<p class="meta">Featuring ${esc(x.participants)}</p>`:''}<p>${esc(x.description||x.bio||x.body||x.summary||'')}</p></div>${extra}</div>`}
function listing(){let arr=data[page]||[];const q=filter.toLowerCase();arr=arr.filter(x=>Object.values(x).some(v=>String(v).toLowerCase().includes(q)));if(page==='events'||page==='news')arr.sort((a,b)=>b.date.localeCompare(a.date));if(page==='rankings')arr.sort((a,b)=>(Number(a.rank)||999)-(Number(b.rank)||999));return `<div class="shell page"><div class="sectionHead"><div><div class="eyebrow">LuchaMania database</div><h2>${esc(labels[page])}</h2></div><span class="muted">${arr.length} record${arr.length===1?'':'s'}</span></div><div class="toolbar"><input class="field" id="search" placeholder="Search ${esc(labels[page].toLowerCase())}..." value="${esc(filter)}" oninput="filter=this.value;updateListing()"><button class="btn" onclick="navTo('admin')">+ Manage records</button></div><div id="results">${results(arr)}</div></div>`}
function results(arr){return arr.length?`<div class="grid">${arr.map(x=>card(page==='events'||page==='news'?dt(x.date):page==='wrestlers'?(x.faction||x.status||'Competitor'):page==='rankings'?`#${x.rank} · ${x.division}`:(x.type||x.status||'Archive'),title(x),x.description||x.bio||x.body||x.summary||x.notes||'',`navTo('${page}','${esc(x.id)}')`)).join('')}</div>`:'<div class="empty">No matching records. Use Admin to add more history.</div>'}
function updateListing(){let a=data[page].filter(x=>Object.values(x).some(v=>String(v).toLowerCase().includes(filter.toLowerCase())));document.getElementById('results').innerHTML=results(a)}
function admin(){let fields=collections[adminType];let rec=editing?item(adminType,editing):null;return `<div class="shell page"><div class="eyebrow">Local content manager</div><div class="sectionHead"><h2>Admin Dashboard</h2></div><div class="adminNotice"><b>Important:</b> This is a local demo admin dashboard, not a secure online login. Changes save only in this browser. Export JSON backups often. Publishing the site does not publish local edits to everyone. A shared admin login and online database are the next phase.</div><div class="actions" style="margin:0 0 20px"><button class="btn primary" onclick="exportData()">↓ Export backup JSON</button><label class="btn">↑ Import backup JSON<input hidden type="file" accept="application/json,.json" onchange="importData(this.files[0])"></label><button class="btn" onclick="resetData()">Reset to sample data</button></div><div class="adminTabs">${Object.keys(collections).map(k=>`<button class="btn small ${adminType===k?'active':''}" onclick="adminType='${k}';editing=null;render()">${esc(labels[k])} (${data[k].length})</button>`).join('')}</div><div class="two"><section class="card"><div class="meta">${rec?'Edit existing':'Create new'}</div><h3>${rec?'Edit':'Add'} ${esc(labels[adminType])}</h3><form class="editor" id="recordForm" onsubmit="submitRecord(event)">${fields.map(([key,label,type])=>`<label class="${type==='textarea'?'full':''}">${esc(label)}${type==='textarea'?`<textarea class="field" name="${key}">${esc(rec?.[key]??'')}</textarea>`:type==='championship'||type==='event'?`<select class="field" name="${key}"><option value="">Choose...</option>${data[type==='championship'?'championships':'events'].map(o=>`<option value="${esc(o.id)}" ${rec?.[key]===o.id?'selected':''}>${esc(type==='event'?`${o.name} (${o.date})`:o.name)}</option>`).join('')}</select>`:`<input class="field" type="${type}" name="${key}" value="${esc(rec?.[key]??'')}" ${key==='name'||key==='title'||key==='holder'?'required':''}>`}</label>`).join('')}<div class="full actions"><button class="btn primary" type="submit">${rec?'Save changes':'Add record'}</button>${rec?`<button class="btn" type="button" onclick="editing=null;render()">Cancel edit</button>`:''}</div></form></section><section class="card"><div class="meta">Saved records</div><h3>${esc(labels[adminType])}</h3>${data[adminType].length?data[adminType].map(x=>`<div class="recordRow"><span>${esc(title(x))}<br><span class="muted" style="font-size:12px">${esc(x.date||x.start||x.status||'')}</span></span><span style="white-space:nowrap"><button class="btn small" onclick="editing='${esc(x.id)}';render()">Edit</button> <button class="btn small" onclick="removeRecord('${adminType}','${esc(x.id)}')">Delete</button></span></div>`).join(''):'<div class="empty">No records yet.</div>'}</section></div></div>`}
function submitRecord(e){e.preventDefault();const f=new FormData(e.target),r={id:editing||'id-'+crypto.randomUUID()};collections[adminType].forEach(([k,l,t])=>r[k]=t==='number'?Number(f.get(k)||0):String(f.get(k)||'').trim());if(editing){let i=data[adminType].findIndex(x=>x.id===editing);if(i>=0)data[adminType][i]=r}else data[adminType].push(r);editing=null;save();render()}
function removeRecord(k,id){if(!confirm('Delete this record? Related records are NOT automatically removed.'))return;data[k]=data[k].filter(x=>x.id!==id);editing=null;save();render()}
function exportData(){let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='luchamania-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importData(file){if(!file)return;try{let d=JSON.parse(await file.text());if(!d||!Object.keys(collections).every(k=>Array.isArray(d[k])))throw Error('Invalid database format');if(!confirm('Replace all current browser data with this backup?'))return;data=d;editing=null;save();render()}catch(e){alert('Unable to import file: '+e.message)}}
function resetData(){if(!confirm('Reset all browser data to original sample records? Export first if you want to keep changes.'))return;data=structuredClone(defaults);editing=null;save();render()}
function render(){nav();document.getElementById('app').innerHTML=page==='home'?home():page==='admin'?admin():selected?detailPage():listing()}
render();
</script>
</body>
</html>
